<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thaís Santos — Staff Product Designer</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180x180.png" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-[var(--paper)]/75 border-b border-[var(--hairline)]">
    <div class="w-full px-6 md:px-10 h-16 flex items-center justify-between">
      <button id="btnHome" class="font-mono text-sm font-semibold tracking-tight flex items-center" aria-label="Home">
        TS<span class="inline-block w-[9px] h-[1.05em] align-[-0.15em] bg-[var(--accent)] animate-blink"></span>
      </button>

      <nav class="hidden md:flex items-center gap-8 font-mono text-[13px] text-[var(--muted)]">
        <button id="btnAbout" class="hover:text-[var(--ink)] transition-colors" data-i18n="nav_about"></button>
        <button id="btnProjects" class="hover:text-[var(--ink)] transition-colors" data-i18n="nav_projects"></button>
        <button id="btnContact" class="hover:text-[var(--ink)] transition-colors" data-i18n="nav_contact"></button>
      </nav>

      <div class="flex items-center gap-1 font-mono text-[12px]">
        <i data-lucide="globe" class="w-[13px] h-[13px] text-[var(--muted)] mr-1"></i>
        <button id="btnLangPt" class="px-1.5 py-0.5 rounded">PT</button>
        <span class="text-[var(--hairline)]">/</span>
        <button id="btnLangEn" class="px-1.5 py-0.5 rounded">EN</button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section id="hero" class="stack-section bg-[var(--paper)]" style="z-index:1">
    <div class="stack-inner flex flex-col justify-center px-6 md:px-10 pt-16 relative">
    <div class="w-full">

      <div data-reveal style="--rd:.05s">
        <div class="inline-flex items-center gap-2.5 border border-[var(--hairline)] rounded-full pl-2.5 pr-4 py-1.5 font-mono text-[11px] text-[var(--muted)] mb-8">
          <span class="relative flex h-2 w-2">
            <span class="animate-pillPulse absolute inline-flex h-full w-full rounded-full bg-[var(--pop)]"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-[var(--pop)]"></span>
          </span>
          <span data-i18n="hero_pill"></span>
        </div>
      </div>

      <div data-reveal style="--ry:24px; --rd:.2s">
        <h1 class="font-mono font-semibold leading-[0.92] tracking-tight text-[13vw] md:text-[7vw]">Thaís Santos</h1>
      </div>

      <p data-reveal style="--rd:.45s" class="block mt-8 max-w-xl text-lg md:text-xl text-[var(--muted)] leading-relaxed" data-i18n="hero_tagline"></p>

      <div data-reveal style="--ry:14px; --rd:.75s">
        <div class="flex flex-wrap items-center gap-6 mt-10">
          <p class="font-mono text-[13px] md:text-[15px] text-[var(--ink)]">
            <span data-i18n="hero_cycle_prefix"></span>
            <span class="relative inline-block overflow-hidden align-middle" style="height:1.15em">
              <span id="cycleWord" class="inline-block animate-wordIn font-semibold text-[var(--accent)]"></span>
            </span>
          </p>
          <button id="btnHeroCta" class="inline-flex items-center gap-2 bg-[var(--pop)] text-[var(--paper)] font-mono text-[12px] px-5 py-2.5 rounded-full hover:opacity-90 transition-opacity">
            <span data-i18n="hero_cta"></span>
            <i data-lucide="arrow-right" class="w-[13px] h-[13px]"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="w-full mt-16">
      <div data-reveal style="--rd:.1s">
        <p class="font-mono text-[11px] tracking-widest uppercase text-[var(--muted)] mb-4" data-i18n="logos_label"></p>
      </div>
      <div class="marquee-wrap relative overflow-hidden border-t border-[var(--hairline)] py-6">
        <div id="logosMarquee" class="marquee-track flex gap-16 w-max"></div>
      </div>
    </div>

    <button id="btnScrollDown" class="absolute bottom-8 left-1/2 -translate-x-1/2 font-mono text-[11px] text-[var(--muted)] flex flex-col items-center gap-2">
      <span data-i18n="hero_scroll"></span>
      <span class="w-px h-8 bg-[var(--hairline)]"></span>
    </button>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects" class="stack-section bg-[var(--paper)]" style="z-index:2">
    <div class="stack-inner px-6 md:px-10 pt-20 md:pt-24 pb-6 md:pb-8 flex flex-col">
    <div id="projectsWrap" class="w-full h-full flex flex-col relative">
      <div data-reveal style="--ry:26px" class="shrink-0">
        <h2 class="font-mono font-semibold leading-[0.92] tracking-tight text-[9vw] md:text-[4vw] mb-2 text-[var(--pop)]" data-i18n="projects_title"></h2>
      </div>
      <div data-reveal style="--rd:.1s" class="shrink-0">
        <p class="text-[var(--muted)] text-sm md:text-base mb-4 md:mb-6 max-w-lg" data-i18n="projects_sub"></p>
      </div>

      <div id="projectsGrid" class="grid grid-cols-2 gap-3 md:gap-5 flex-1 min-h-0"
           style="grid-template-rows: repeat(3, minmax(0, 1fr));"></div>

      <!-- Custom cursor — pill label + circular icon badge, desktop only -->
      <div id="cursorFollower" class="hidden md:flex fixed z-40 pointer-events-none items-center transition-opacity duration-200" style="opacity:0; transform:translate(-50%,-50%);">
        <span id="cursorPill" class="bg-[var(--ink)] text-[var(--paper)] font-mono text-[12px] px-4 py-2 rounded-full whitespace-nowrap -mr-4"></span>
        <span class="w-14 h-14 rounded-full bg-white shadow-xl flex items-center justify-center border border-[var(--hairline)]">
          <i id="cursorIcon" data-lucide="folder-open" class="w-[18px] h-[18px] text-[var(--paper)]"></i>
        </span>
      </div>
    </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about" class="stack-section bg-[var(--paper)]" style="z-index:3">
    <div class="stack-inner px-6 md:px-10 py-24 flex items-center">
    <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-20 items-center">
      <div data-reveal style="--rx:-24px; --ry:0px" class="order-2 md:order-1">
        <div class="about-gallery max-w-sm mx-auto md:mx-0">
          <div class="gallery-tile" data-reveal style="top:0%; left:2%; width:40%; height:29%; --rot:-9deg; --rd:0s; z-index:2;">
            <img src="img-25.jpg" alt="" loading="lazy" data-lightbox-group="about" data-lightbox-idx="0" />
          </div>
          <div class="gallery-tile" data-reveal style="top:-2%; left:44%; width:36%; height:26%; --rot:7deg; --rd:.07s; z-index:3;">
            <img src="img-26.jpg" alt="" loading="lazy" data-lightbox-group="about" data-lightbox-idx="1" />
          </div>
          <div class="gallery-tile" data-reveal style="top:14%; left:76%; width:33%; height:27%; --rot:-6deg; --rd:.14s; z-index:2;">
            <img src="img-27.jpg" alt="" loading="lazy" data-lightbox-group="about" data-lightbox-idx="2" />
          </div>
          <div class="gallery-tile" data-reveal style="top:24%; left:28%; width:42%; height:30%; --rot:5deg; --rd:.21s; z-index:5;">
            <img src="img-28.jpg" alt="" loading="lazy" data-lightbox-group="about" data-lightbox-idx="3" />
          </div>
          <div class="gallery-tile" data-reveal style="top:20%; left:-4%; width:33%; height:26%; --rot:10deg; --rd:.28s; z-index:1;">
            <img src="img-29.jpg" alt="" loading="lazy" data-lightbox-group="about" data-lightbox-idx="4" />
          </div>
          <div class="gallery-tile" data-reveal style="top:52%; left:58%; width:40%; height:29%; --rot:-8deg; --rd:.35s; z-index:4;">
            <img src="img-30.jpg" alt="" loading="lazy" data-lightbox-group="about" data-lightbox-idx="5" />
          </div>
          <div class="gallery-tile" data-reveal style="top:58%; left:8%; width:38%; height:27%; --rot:6deg; --rd:.42s; z-index:2;">
            <img src="img-31.jpg" alt="" loading="lazy" data-lightbox-group="about" data-lightbox-idx="6" />
          </div>
          <div class="gallery-tile" data-reveal style="top:70%; left:38%; width:37%; height:29%; --rot:-4deg; --rd:.49s; z-index:3;">
            <img src="img-32.jpg" alt="" loading="lazy" data-lightbox-group="about" data-lightbox-idx="7" />
          </div>
        </div>
      </div>

      <div class="order-1 md:order-2">
        <div data-reveal style="--rx:24px; --ry:0px">
          <p class="font-mono text-[13px] tracking-widest uppercase text-[var(--accent)] mb-6" data-i18n="about_kicker"></p>
        </div>
        <div data-reveal style="--rx:24px; --ry:0px; --rd:.1s">
          <p class="text-xl md:text-2xl leading-relaxed mb-12 max-w-lg" data-i18n="about_bio"></p>
        </div>
        <div class="grid grid-cols-3 gap-6 border-t border-[var(--hairline)] pt-6 max-w-lg">
          <div data-reveal style="--rd:.25s">
            <p class="font-mono text-2xl md:text-3xl font-semibold text-[var(--accent)]" data-i18n="about_stat1_n"></p>
            <p class="text-[12px] text-[var(--muted)] mt-1 leading-snug" data-i18n="about_stat1_l"></p>
          </div>
          <div data-reveal style="--rd:.33s">
            <p class="font-mono text-2xl md:text-3xl font-semibold text-[var(--accent)]" data-i18n="about_stat2_n"></p>
            <p class="text-[12px] text-[var(--muted)] mt-1 leading-snug" data-i18n="about_stat2_l"></p>
          </div>
          <div data-reveal style="--rd:.41s">
            <p class="font-mono text-2xl md:text-3xl font-semibold text-[var(--accent)]" data-i18n="about_stat3_n"></p>
            <p class="text-[12px] text-[var(--muted)] mt-1 leading-snug" data-i18n="about_stat3_l"></p>
          </div>
        </div>
      </div>
    </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="stack-section bg-[var(--ink)]" style="z-index:4">
    <div class="stack-inner px-6 md:px-10 py-24 flex flex-col justify-center bg-[var(--ink)] text-[var(--paper)]">
    <div class="w-full">
      <div data-reveal>
        <p class="font-mono text-[13px] tracking-widest uppercase text-black/50 mb-6" data-i18n="contact_kicker"></p>
      </div>
      <div data-reveal style="--ry:26px; --rd:.1s">
        <h2 class="font-mono font-semibold leading-[0.92] tracking-tight text-[12vw] md:text-[6vw] mb-6" data-i18n="contact_title"></h2>
      </div>
      <div data-reveal style="--rd:.2s">
        <p class="text-black/60 text-base md:text-lg mb-14 max-w-md" data-i18n="contact_sub"></p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-px bg-black/10 rounded-xl overflow-hidden max-w-3xl">
        <div data-reveal style="--ry:22px; --rd:.3s">
          <a href="mailto:tha.b@live.hk" class="group bg-[var(--ink)] hover:bg-black/5 transition-colors p-6 flex flex-col gap-4 h-full">
            <div class="flex items-center justify-between">
              <i data-lucide="mail" class="w-[18px] h-[18px] text-black/70"></i>
              <i data-lucide="arrow-up-right" class="w-[15px] h-[15px] text-black/30 group-hover:text-black/70 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all"></i>
            </div>
            <div>
              <p class="font-mono text-[10px] uppercase tracking-widest text-black/40 mb-1" data-i18n="contact_email_l"></p>
              <p class="text-sm break-all">tha.b@live.hk</p>
            </div>
          </a>
        </div>
        <div data-reveal style="--ry:22px; --rd:.38s">
          <a href="https://wa.me/5511983382985" target="_blank" rel="noreferrer" class="group bg-[var(--ink)] hover:bg-black/5 transition-colors p-6 flex flex-col gap-4 h-full">
            <div class="flex items-center justify-between">
              <i data-lucide="phone" class="w-[18px] h-[18px] text-black/70"></i>
              <i data-lucide="arrow-up-right" class="w-[15px] h-[15px] text-black/30 group-hover:text-black/70 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all"></i>
            </div>
            <div>
              <p class="font-mono text-[10px] uppercase tracking-widest text-black/40 mb-1" data-i18n="contact_phone_l"></p>
              <p class="text-sm">+55 11 98338-2985</p>
            </div>
          </a>
        </div>
        <div data-reveal style="--ry:22px; --rd:.46s">
          <a href="https://www.linkedin.com/in/thaisbarbosa/" target="_blank" rel="noreferrer" class="group bg-[var(--ink)] hover:bg-black/5 transition-colors p-6 flex flex-col gap-4 h-full">
            <div class="flex items-center justify-between">
              <i data-lucide="linkedin" class="w-[18px] h-[18px] text-black/70"></i>
              <i data-lucide="arrow-up-right" class="w-[15px] h-[15px] text-black/30 group-hover:text-black/70 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all"></i>
            </div>
            <div>
              <p class="font-mono text-[10px] uppercase tracking-widest text-black/40 mb-1" data-i18n="contact_linkedin_l"></p>
              <p class="text-sm">/in/thaisbarbosa</p>
            </div>
          </a>
        </div>
      </div>

      <div class="mt-16 pt-6 border-t border-black/10 flex items-center justify-between font-mono text-[11px] text-black/30">
        <span id="footerYear"></span>
        <span data-i18n="footer_rights"></span>
      </div>
    </div>
    </div>
  </section>

</div>

<!-- PROJECT PAGE — opens full screen -->
<div id="projectPage" class="fixed inset-0 z-[200] hidden bg-[var(--paper)] overflow-y-auto overflow-x-hidden">
  <button id="btnProjectBack" class="fixed top-5 left-5 md:top-6 md:left-6 z-10 inline-flex items-center gap-2 bg-[var(--paper)]/90 backdrop-blur border border-[var(--hairline)] rounded-full pl-3 pr-4 py-2 font-mono text-[12px] hover:bg-[var(--tint)] transition-colors">
    <i data-lucide="arrow-left" class="w-[14px] h-[14px]"></i>
    <span data-i18n="back_label"></span>
  </button>
  <div id="projectPageBody"></div>
</div>

<!-- LIGHTBOX — fullscreen image viewer with navigation -->
<div id="lightbox" class="fixed inset-0 z-[300] hidden bg-black/95 items-center justify-center">
  <button id="lightboxClose" class="fixed top-5 right-5 md:top-6 md:right-6 z-10 inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors">
    <i data-lucide="x" class="w-5 h-5"></i>
  </button>
  <button id="lightboxPrev" class="fixed left-3 md:left-6 top-1/2 -translate-y-1/2 z-10 inline-flex items-center justify-center w-10 h-10 md:w-12 md:h-12 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors">
    <i data-lucide="chevron-left" class="w-6 h-6"></i>
  </button>
  <button id="lightboxNext" class="fixed right-3 md:right-6 top-1/2 -translate-y-1/2 z-10 inline-flex items-center justify-center w-10 h-10 md:w-12 md:h-12 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors">
    <i data-lucide="chevron-right" class="w-6 h-6"></i>
  </button>
  <img id="lightboxImg" src="" alt="" class="max-w-[92vw] max-h-[88vh] object-contain" />
</div>

<!-- ZOOM LIGHTBOX — fullscreen pan/zoom viewer for high-definition images -->
<div id="zoomLightbox" class="fixed inset-0 z-[300] hidden bg-black/95 items-center justify-center">
  <button id="zoomLightboxClose" class="fixed top-5 right-5 md:top-6 md:right-6 z-20 inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors">
    <i data-lucide="x" class="w-5 h-5"></i>
  </button>
  <div class="relative w-full h-full" data-canvas-viewer>
    <div class="absolute inset-0 cursor-grab" data-canvas-stage style="touch-action:none;">
      <img id="zoomLightboxImg" src="" alt="" class="absolute top-0 left-0 select-none pointer-events-none" draggable="false" data-canvas-img style="transform-origin:0 0;" />
    </div>
    <div class="absolute bottom-5 right-5 md:bottom-6 md:right-6 flex gap-2 z-20">
      <button type="button" data-canvas-zoom-out class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-[18px] leading-none">−</button>
      <button type="button" data-canvas-zoom-reset class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
      <button type="button" data-canvas-zoom-in class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-[18px] leading-none">+</button>
    </div>
  </div>
</div>


<script src="script.js"></script>

</body>
</html>
